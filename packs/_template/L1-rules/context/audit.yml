# L1 上下文规则 - 审计规则（模板）
# 领域特定：勾稽校验和审计检查
# 关键词触发加载
# 引用语法: [L1:context:audit] 指向本文件，[L1:context:aud-xxx] 指向具体规则
keywords: [勾稽, 审计, 校验, 报表, 平衡]

checks:
  - id: aud-cash-flow-check
    name: 现金流量表勾稽
    rule: "经营活动+投资活动+筹资活动现金流 == 现金净增加额"
    severity: warn
    message: "现金流量表勾稽不平衡，差额{diff}，请核查"
    variables:
      diff: "计算差额"

  # 在此添加你的自定义审计规则...
